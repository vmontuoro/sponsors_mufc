<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What sort of sponsor are you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2352; --navy-2:#12306B; --royal:#1D56B8; --sky:#6CC4F2; --sky-soft:#BFE6FA;
  --paper:#F3F7FC; --card:#FFFFFF; --ink:#0B2352; --muted:#5A6B87; --line:#DCE5F0;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#081A3E;--card:#0F2757;--ink:#EAF4FD;--muted:#A9BBD6;--line:#1E3A72}
}
:root[data-theme="dark"]{--paper:#081A3E;--card:#0F2757;--ink:#EAF4FD;--muted:#A9BBD6;--line:#1E3A72}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:.96;margin:0;letter-spacing:-.01em}

/* shell */
.app{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px 8px}
.bar img{width:34px;height:34px;object-fit:contain;flex:none}
.bar .where{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em;flex:1;color:var(--muted)}
.restart{background:none;border:0;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:3px}
.restart[hidden]{display:none}
.rail{height:4px;background:var(--line);margin:0 20px;border-radius:2px;overflow:hidden}
.rail i{display:block;height:100%;width:0;background:var(--sky);transition:width .45s cubic-bezier(.22,1,.36,1)}

main{flex:1;display:grid;grid-template-columns:minmax(0,1fr);position:relative}
.screen{grid-area:1/1;min-width:0;opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .4s ease,transform .4s ease,visibility .4s;
  padding:18px 20px 96px;display:flex;flex-direction:column}
.screen.on{opacity:1;visibility:visible;transform:none}

/* welcome */
.welcome{justify-content:center;text-align:center;gap:6px}
.welcome .crest{width:min(190px,46vw);margin:0 auto 14px}
.welcome h1{font-size:clamp(40px,11vw,68px);text-transform:uppercase;font-style:italic}
.welcome h1 span{display:block;color:var(--royal)}
:root[data-theme="dark"] .welcome h1 span{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .welcome h1 span{color:var(--sky)}}
.welcome p{color:var(--muted);max-width:34ch;margin:14px auto 0}
.welcome .mins{margin-top:6px;font-size:15px;color:var(--muted)}

/* questions */
.qnum{font-family:var(--display);font-weight:700;font-size:17px;color:var(--royal);letter-spacing:.04em}
:root[data-theme="dark"] .qnum{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qnum{color:var(--sky)}}
.screen h2{font-size:clamp(32px,7.6vw,46px);margin:8px 0 4px}
.qsub{color:var(--muted);margin:0 0 18px;font-size:16px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:6px 1fr;gap:14px;align-items:stretch;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0;cursor:pointer;
  overflow:hidden;min-height:56px;transition:border-color .18s,transform .12s,box-shadow .18s}
.opt i{background:var(--line);transition:background .18s}
.opt .txt{padding:14px 16px 15px}
.opt b{display:block;font-weight:600;font-size:17px;line-height:1.25}
.opt small{display:block;color:var(--muted);font-size:14.5px;margin-top:3px;line-height:1.35}
@media (hover:hover){.opt:hover{border-color:var(--royal)}.opt:hover i{background:var(--royal)}}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--royal);box-shadow:0 0 0 3px rgba(29,86,184,.16)}
.opt[aria-pressed="true"] i{background:var(--royal)}

/* club cards */
.card{padding:18px 0 0}
.card .inner{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--navy);color:#fff;border-radius:24px;overflow:hidden;margin:0 20px 96px}
.card .pic{position:relative;aspect-ratio:16/10;background:var(--navy-2) center/cover no-repeat}
.card .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--navy),rgba(11,35,82,0) 62%)}
.card .body{padding:18px 22px 24px;margin-top:-34px;position:relative;z-index:1}
.card .eyebrow{font-family:var(--display);font-weight:700;font-size:16px;color:var(--sky);letter-spacing:.06em;text-transform:uppercase}
.card h2{font-size:clamp(34px,8vw,52px);text-transform:uppercase;font-style:italic;margin:2px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{min-width:0}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,40px);line-height:1;color:var(--sky)}
.stats span{display:block;font-size:13.5px;color:#D6E6F7;margin-top:4px;line-height:1.25}
.card p{color:#D6E6F7;margin:0;font-size:16px}
.places{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
@media (min-width:560px){.places{grid-template-columns:repeat(4,1fr)}}
.places figure{margin:0;border-radius:10px;overflow:hidden;background:var(--navy-2)}
.places img{width:100%;aspect-ratio:4/3;object-fit:cover}
.places figcaption{font-size:12.5px;color:#D6E6F7;padding:5px 2px 2px;line-height:1.2;text-align:center}

/* programs card */
.progcard{position:relative;padding:0}
.pslides{position:relative;flex:1;min-height:300px}
.pslide{position:absolute;inset:0;background:var(--navy-2) center 28%/cover no-repeat;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.pslide.on{opacity:1;visibility:visible}
.pslide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--navy) 6%,rgba(11,35,82,.15) 58%,rgba(11,35,82,.55))}
.phead{position:absolute;top:0;left:0;right:0;padding:18px 22px 0;z-index:2}
.pname{position:absolute;left:0;right:0;bottom:0;padding:0 22px 16px;z-index:2}
.pname .ages{display:inline-block;background:var(--sky);color:var(--navy);font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px}
.pname h3{font-size:clamp(30px,8vw,46px);text-transform:uppercase;font-style:italic;color:#fff;margin:9px 0 0}
.pfoot{padding:12px 0 16px;background:var(--navy)}
.ticker{overflow:hidden;max-width:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:8px;width:max-content;animation:tick 42s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (hover:hover){.ticker:hover .track{animation-play-state:paused}}
.chip{flex:none;border:1.5px solid rgba(255,255,255,.22);color:#D6E6F7;background:transparent;font:600 14px var(--body);padding:7px 13px;border-radius:999px;white-space:nowrap}
.chip.on{background:var(--sky);color:var(--navy);border-color:var(--sky)}
@media (prefers-reduced-motion:reduce){.track{animation-duration:84s}.pslide{transition-duration:.25s}}

/* numbers card */
.numcard .body{margin-top:22px}
.bignums{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px;margin:4px 0 16px}
@media (min-width:560px){.bignums{grid-template-columns:repeat(4,1fr)}}
.bignums div{min-width:0}
.bignums b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:.95;color:var(--sky);font-variant-numeric:tabular-nums}
.bignums span{display:block;font-size:13.5px;color:#D6E6F7;margin-top:4px;line-height:1.3}
.kicker{font-size:17px;color:#fff;font-weight:600}

/* result */
.result{gap:0}
.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--sky);color:var(--navy);
  font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
.pick{background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;margin-top:12px}
.pick .crown{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;color:var(--navy);font-weight:700}
.pick .crown .tier{font-family:var(--display);font-weight:800;font-size:25px;text-transform:uppercase;line-height:1}
.pick .in{padding:18px 20px 22px}
.pick h2{font-size:clamp(34px,8vw,50px)}
.price{font-family:var(--display);font-weight:800;font-size:clamp(38px,9vw,54px);line-height:1;color:var(--royal);margin:8px 0 2px}
:root[data-theme="dark"] .price{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .price{color:var(--sky)}}
.pick .note{color:var(--muted);font-size:15px;margin:0}
.gstbig{font-family:var(--body);font-weight:600;font-size:15px;color:var(--muted);margin-left:8px;letter-spacing:0}
.why{margin:16px 0 0;padding:14px 16px;border-radius:14px;background:rgba(29,86,184,.08)}
.why b{display:block;font-size:15px;margin-bottom:6px}
.why ul,.incl{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:15.5px}
.why li,.incl li{padding-left:22px;position:relative}
.why li::before,.incl li::before{content:"";position:absolute;left:0;top:.52em;width:9px;height:9px;border-radius:50%;background:var(--sky)}
.incl{margin-top:16px}
.alt{margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px}
.alt .lbl{font-size:13.5px;color:var(--muted);font-weight:600}
.alt .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-top:3px}
.alt h3{font-size:26px}
.alt .p{font-family:var(--display);font-weight:800;font-size:24px;color:var(--muted);white-space:nowrap}
.more{display:block;text-align:center;margin:18px 0 4px;color:var(--royal);font-weight:600;font-size:15.5px}
:root[data-theme="dark"] .more{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .more{color:var(--sky)}}

/* bottom nav */
.nav{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 72%,rgba(243,247,252,0));position:sticky;bottom:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav{background:linear-gradient(to top,var(--paper) 72%,rgba(8,26,62,0))}}
:root[data-theme="dark"] .nav{background:linear-gradient(to top,var(--paper) 72%,rgba(8,26,62,0))}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 20px;
  border-radius:14px;font-weight:600;font-size:17px;text-decoration:none;border:0;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--royal);color:#fff}
.btn-sky{background:var(--sky);color:var(--navy)}
.btn-ghost{flex:none;background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:14px 18px}
.btn[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .screen{transition-duration:.2s;transform:none}
  .rail i{transition-duration:.2s}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <img id="crest" alt="Manningham United FC crest">
    <span class="where" id="where">Find your fit</span>
    <button class="restart" id="restart" hidden>Start again</button>
  </div>
  <div class="rail"><i id="rail"></i></div>
  <main id="main"></main>
  <div class="nav">
    <button class="btn btn-ghost" id="back" hidden>Back</button>
    <button class="btn btn-primary" id="next">Start</button>
    <a class="btn btn-sky" id="text" hidden href="#">Text David about this</a>
  </div>
</div>

      <div class="opts" role="group" aria-label="${esc(q.q)}">
        ${q.opts.map((o,i)=>`<button class="opt" data-q="${n-1}" data-i="${i}" aria-pressed="false">
          <i aria-hidden="true"></i><span class="txt"><b>${esc(o.t)}</b><small>${esc(o.d)}</small></span>
        </button>`).join('')}
      </div>
    </section>`;
  }

  if (n <= Q.length + cards().length){
    const c = cards()[n - Q.length - 1];

    if (c.type === 'programs'){
      const slides = PROGRAMS.map((p,i)=>`<div class="pslide${i?'':' on'}" style="background-image:url('${IMG[p[0]]}')">
        <div class="pname"><span class="ages">${esc(p[2])}</span><h3>${esc(p[1])}</h3></div></div>`).join('');
      const chips = [0,1].map(()=>PROGRAMS.map((p,i)=>`<span class="chip" data-i="${i}">${esc(p[1])}</span>`).join('')).join('');
      return `<section class="screen card"><div class="inner progcard">
        <div class="pslides">
          ${slides}
          <div class="phead"><span class="eyebrow">${esc(c.eyebrow)}</span>
            <h2 style="font-size:clamp(28px,7vw,40px);text-transform:uppercase;font-style:italic;margin-top:2px">${esc(c.title)}</h2></div>
        </div>
        <div class="pfoot"><div class="ticker"><div class="track">${chips}</div></div></div>
      </div></section>`;
    }

    const nums = c.nums ? `<div class="bignums">${c.nums.map(x=>
      `<div><b data-to="${x[0]}" data-suffix="${/^[A-Za-z+]/.test(x[1])&&x[1].length<3?x[1]:''}" data-prefix="${x[1].trim().length>2?x[1]:''}">0</b><span>${esc(x[2])}</span></div>`).join('')}</div>` : '';
    const pic = c.img ? `<div class="pic" style="background-image:url('${IMG[c.img]}')"></div>` : '';
    const places = c.places ? `<div class="places">${c.places.map(p=>`<figure><img src="${IMG[p[0]]}" alt="${esc(p[1])}" loading="lazy"><figcaption>${esc(p[1])}</figcaption></figure>`).join('')}</div>` : '';
    return `<section class="screen card"><div class="inner${c.type==='numbers'?' numcard':''}">
      ${pic}
      <div class="body" style="${c.img ? '' : 'margin-top:22px'}">
        <span class="eyebrow">${esc(c.eyebrow)}</span>
        <h2>${esc(c.title)}</h2>
        ${nums}
        ${c.kicker ? `<p class="kicker">${esc(c.kicker)}</p>` : ''}
        ${c.places ? `<p style="margin-bottom:14px">${esc(c.body)}</p>${places}` : (c.body ? `<p>${esc(c.body)}</p>` : '')}
      </div>
    </div></section>`;
  }

  const r = recommend();
  const p = PACKS[r.pick], a = PACKS[r.alt];
  return `<section class="screen result">
    <div class="pick">
      <div class="crown" style="background:${p.grad}"><span>Pack ${p.no}</span><span class="tier">${esc(p.tier)}</span></div>
      <div class="in">
        <h2>${esc(p.name)}</h2>
        <div class="price">${esc(p.price).replace(" + GST","")}<span class="gstbig">+ GST</span></div>
        <p class="note">${esc(p.note)}</p>
        <div class="why"><b>Why this one</b><ul>${r.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
        <ul class="incl">${p.incl.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
      </div>
    </div>
    <div class="alt">
      <span class="lbl">Also worth a look</span>
      <div class="row"><h3>${esc(a.name)}</h3><span class="p">${esc(a.price)}</span></div>
    </div>
    <a class="more" href="${FULL_PAGE}">See everything the club offers →</a>
  </section>`;
}

function recommend(){
  const total = {}; Object.keys(PACKS).forEach(k => total[k] = 0);
  const contrib = {};
  Q.forEach(q => {
    const pickIdx = answers[q.id];
    if (pickIdx === undefined) return;
    const o = q.opts[pickIdx];
    Object.entries(o.w).forEach(([k,v]) => { total[k] += v; (contrib[k] = contrib[k] || []).push({v, because:o.because}); });
  });
  const band = BAND[(Q.find(x=>x.id==='size').opts[answers.size]||{}).band] || [];
  const order = Object.keys(PACKS).sort((a,b) =>
    (total[b] - total[a]) || ((band.includes(b)?1:0) - (band.includes(a)?1:0)) || (PACKS[a].no - PACKS[b].no));
  const pick = order[0], alt = order[1];
  const why = (contrib[pick] || []).sort((x,y) => y.v - x.v).slice(0,2).map(c => 'Because ' + c.because + '.');
  return {pick, alt, why, total};
}
window.__recommend = recommend;   // used by the test harness

function render(){
  const html = screenHTML(step);
  const old = main.firstElementChild;
  main.insertAdjacentHTML('beforeend', html);
  const el = main.lastElementChild;
  requestAnimationFrame(()=>{ el.classList.add('on'); if (old) old.remove(); });
  clearInterval(progTimer); progTimer = null;
  countUp(el);
  startPrograms(el);

  railEl.style.width = (step / total() * 100) + '%';
  whereEl.textContent = step === 0 ? 'Find your fit'
    : step <= Q.length ? 'Find your fit'
    : step <= Q.length + cards().length ? 'About the club'
    : 'Your best fit';
  restartBtn.hidden = step === 0;
  if (step === total()){
    const r = recommend(), pk = PACKS[r.pick];
    const msg = `Hi David, we did the fit finder on the sponsor page and it pointed us to Pack ${pk.no} — ${pk.tier}, ${pk.name} (${pk.price}).\nName:\nBusiness:`;
    textBtn.href = 'sms:' + PHONE + '?&body=' + encodeURIComponent(msg);
  }
  textBtn.hidden = step !== total();
  backBtn.hidden = step === 0;
  nextBtn.hidden = step === total() || (step >= 1 && step <= Q.length && answers[Q[step-1].id] === undefined);
  nextBtn.textContent = step === 0 ? 'Start'
    : step === Q.length + cards().length ? 'See my best fit'
    : step <= Q.length ? 'Next' : 'Next';
  if (step >= 1 && step <= Q.length){
    const chosen = answers[Q[step-1].id];
    if (chosen !== undefined){
      const b = el.querySelector(`.opt[data-i="${chosen}"]`);
      if (b) b.setAttribute('aria-pressed','true');
    }
  }
  main.scrollIntoView({block:'start', behavior:'auto'});
  window.scrollTo(0,0);
}

let progTimer = null;

/* numbers count up every time a card with them lands */
function countUp(root){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('b[data-to]').forEach(el => {
    const to = +el.dataset.to, suf = el.dataset.suffix || '', pre = el.dataset.prefix || '';
    const fmt = v => pre + v.toLocaleString('en-AU') + suf;
    if (reduce){ el.textContent = fmt(to); return; }
    const t0 = performance.now(), d = 1300;
    const tick = t => { const p = Math.min(1,(t-t0)/d), e = 1-Math.pow(1-p,3);
      el.textContent = fmt(Math.round(to*e)); if (p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

/* the programs card runs itself, same 2 second beat as the main page */
function startPrograms(root){
  const slides = [...root.querySelectorAll('.pslide')];
  const chips = [...root.querySelectorAll('.chip')];
  if (!slides.length) return;
  let i = 0;
  const show = n => {
    slides[i].classList.remove('on');
    i = (n + slides.length) % slides.length;
    slides[i].classList.add('on');
    chips.forEach(c => c.classList.toggle('on', +c.dataset.i === i));
  };
  show(0);
  progTimer = setInterval(() => show(i + 1), 2000);
  root.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    clearInterval(progTimer); show(+c.dataset.i); progTimer = setInterval(() => show(i + 1), 2000);
  }));
}

function go(n){ step = Math.max(0, Math.min(total(), n)); render(); }

main.addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  const qi = +b.dataset.q, oi = +b.dataset.i;
  answers[Q[qi].id] = oi;
  b.parentElement.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  nextBtn.hidden = false;
  setTimeout(()=>go(step + 1), 230);
});
nextBtn.addEventListener('click', ()=>go(step + 1));
backBtn.addEventListener('click', ()=>go(step - 1));
restartBtn.addEventListener('click', ()=>{ Object.keys(answers).forEach(k=>delete answers[k]); go(0); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !nextBtn.hidden) go(step + 1);
  if (e.key === 'ArrowLeft' && !backBtn.hidden) go(step - 1);
});
let x0 = null;
main.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
main.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) < 50) return;
  if (dx < 0 && !nextBtn.hidden) go(step + 1);
  if (dx > 0 && !backBtn.hidden) go(step - 1);
});

render();
</script>
</body>
</html>
